name: Stage official sales tax data
on:
  schedule:
    - cron: '47 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-reconcile-sales-tax.py
      - run: python scripts/stage-sales-tax.py
      - run: python scripts/normalize-sales-tax.py
      - run: python scripts/prepare-sales-tax-release.py
      - name: Maintenance summary
        if: always()
        run: |
          echo '## Sales tax staging (review only)' >> "$GITHUB_STEP_SUMMARY"
          if [ -f staged-sales-tax/release-review.json ]; then
            echo 'Candidate prepared; manual approval required.' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat staged-sales-tax/release-review.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No release review generated. Inspect failed steps. Published data unchanged.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staged-sales-tax
          path: staged-sales-tax/
          retention-days: 30
