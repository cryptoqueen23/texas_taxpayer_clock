name: Reconcile official BRB debt
on:
  workflow_dispatch:
  push:
    branches: ['audit/phase-20']
    paths:
      - 'scripts/reconcile-brb.py'
      - 'scripts/test-reconcile-brb.py'
      - '.github/workflows/reconcile-brb.yml'
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-financial-evidence.py
      - run: python scripts/test-reconcile-brb.py
      - run: python scripts/reconcile-brb.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brb-reconciliation
          path: brb-reconciliation/
          retention-days: 90
          if-no-files-found: warn
