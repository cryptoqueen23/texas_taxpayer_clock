name: Import statewide property tax rates
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python scripts/import-tax-units.py
      - run: |
          git config user.name "Texas Taxpayer Clock data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tax-units.json
          git diff --cached --quiet || git commit -m "Import official statewide tax rate directory"
          git push
