name: Import statewide property tax rates
on:
  workflow_dispatch:
  push:
    paths:
      - public/data/tax-units.json
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate locally prepared official data
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('public/data/tax-units.json')
          if not p.exists():
              raise SystemExit('Upload the locally validated tax-units.json to public/data/ first.')
          rows=json.loads(p.read_text())
          ids=[r['id'] for r in rows]
          assert len(ids)==len(set(ids)) and len(ids)>=4862
          assert sum(i.endswith('-000-00') for i in ids)==254
          for r in rows:
              assert re.fullmatch(r'\d{3}-\d{3}-\d{2}',r['id'])
              assert r['name'] and r['rates']
              assert all(y in {'2021','2022','2023','2024','2025'} and (v is None or isinstance(v,(int,float)) and v>=0) for y,v in r['rates'].items())
          print(f'Validated {len(rows)} taxing units and 254 counties')
          PY
