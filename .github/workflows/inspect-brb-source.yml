name: Inspect official BRB debt source
on:
  workflow_dispatch:
  push:
    branches: ['audit/phase-20']
    paths:
      - 'scripts/inspect-brb-source.py'
      - '.github/workflows/inspect-brb-source.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-financial-evidence.py
      - run: python scripts/inspect-brb-source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brb-source-inspection
          path: brb-source-inspection/
          if-no-files-found: warn
          retention-days: 90
