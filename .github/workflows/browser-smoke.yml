name: Browser smoke tests
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - audit/phase-19
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-site-quality.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/browser-smoke.mjs
