name: Monitor official financial sources
on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/monitor-sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-monitor
          path: source-monitor-report.json
          retention-days: 90
